[project]
name = "stocks-on-the-move"
version = "0.1.0"
description = "Weekly momentum portfolio for NSE equities, after Andreas Clenow's 'Stocks on the Move'"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Aditya Zagade", email = "aditya.zagade@clear.in" }
]
requires-python = ">=3.12"
dependencies = [
    "kiteconnect>=5.0.1,<6",
    "numpy>=2.0,<3",
    # pandas 3.x changes copy-on-write and string-dtype defaults; stay on 2.x
    # until the strategy math has been re-validated against it.
    "pandas>=2.2,<3",
    "pydantic-settings>=2.15,<3",
]

[project.scripts]
stocks-on-the-move = "stocks_on_the_move.momentum:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
    "ty==0.0.80",
    "uv>=0.12.9,<0.13",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

# ── tooling ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
src = ["src", "tests"]
# Earlier script iterations are kept verbatim for reference; never lint or format them.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# ty (ADR-010): pinned exactly in the dev group above and in .pre-commit-config.yaml;
# the two versions move together. `uv run ty check` is the developer command.
[tool.ty.src]
include = ["src", "tests"]
exclude = ["archive"]  # earlier script iterations, kept verbatim; never checked (same as ruff)

[tool.ty.environment]
python-version = "3.12"  # the lowest version requires-python promises

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
